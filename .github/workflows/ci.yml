name: CI

on:
  pull_request:
    branches: [next]
  push:
    branches: [next]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (warnings are failures)
        run: |
          pnpm build 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -qi warn "$RUNNER_TEMP/build.log"; then
            echo "::error::build output contains warnings"
            exit 1
          fi

      - name: Validate HTML
        run: pnpm dlx html-validate@11.16.2 "dist/**/*.html"

      - name: Check internal links
        run: python3 scripts/check-links.py

      - name: Check formatting
        run: |
          # dlx installs the plugin, but prettier resolves plugin names from the
          # repository, so pass it by path out of the temporary dlx install.
          pnpm dlx --package=prettier@3.9.10 --package=prettier-plugin-astro@1.1.1 --shell-mode '
            plugin="$(dirname "$(command -v prettier)")/../prettier-plugin-astro/dist/index.js"
            prettier --check --plugin="$plugin" \
              "src/**/*.{astro,ts,js,mjs,css}" "public/**/*.{css,js}"
          '

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
